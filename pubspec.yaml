name: cie_login_flutter
description: App Flutter cross-platform per login con CIE (Carta d'Identità Elettronica)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # WebView per il flusso di autenticazione
  webview_flutter: ^4.4.2
  
  # Per aprire URL esterni (App Store/Play Store)
  url_launcher: ^6.2.1
  
  # Per verificare la connettività
  connectivity_plus: ^5.0.2
  
  # Per lo storage locale (opzionale - per salvare lo stato di login)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
